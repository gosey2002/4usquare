<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>모바일 미리보기</title>
<style>html,body{margin:0;padding:0;background:#eef2f7}
#f{border:0;display:block;width:390px;height:844px;margin:24px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.15)}</style>
</head><body>
<iframe id="f" src="index.html?v=2"></iframe>
<script>
const f=document.getElementById('f');
f.addEventListener('load',()=>{
  try{
    const d=f.contentDocument, w=f.contentWindow;
    const h=[...d.querySelectorAll('h3')].find(x=>x.textContent.includes('비렉스'));
    const g=h.closest('div.group');
    w.scrollTo(0, g.getBoundingClientRect().top + w.scrollY - 64);
  }catch(e){document.title='ERR '+e.message;}
});
</script>
</body></html>
